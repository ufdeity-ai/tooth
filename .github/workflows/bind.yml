name: bind hwid
on:
  repository_dispatch:
    types: [bind_hwid]

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: bind hwid to key
        env:
          KEY: ${{ github.event.client_payload.key }}
          HWID: ${{ github.event.client_payload.hwid }}
        run: |
          python3 << PYEOF
          import json, os, sys
          key  = os.environ["KEY"]
          hwid = os.environ["HWID"]
          with open("keys.json", "r") as f:
              data = json.load(f)
          if key not in data["keys"]:
              print("key not found, skipping")
              sys.exit(0)
          if data["keys"][key]["hwid"] != "":
              print("already bound, skipping")
              sys.exit(0)
          data["keys"][key]["hwid"] = hwid
          with open("keys.json", "w") as f:
              json.dump(data, f, indent=2)
          print(f"bound {key} to {hwid}")
          PYEOF

      - name: commit and push
        run: |
          git config user.email "autobind@keysys"
          git config user.name "key bind bot"
          git add keys.json
          git diff --cached --quiet || git commit -m "auto bind"
          git push
